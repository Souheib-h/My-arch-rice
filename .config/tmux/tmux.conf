# ─────────────────────────────────────────────────────────────
# 🎯 Default shell & general options
# ─────────────────────────────────────────────────────────────
set -g default-shell /bin/zsh
set -g set-clipboard on                # Use system clipboard
set -g detach-on-destroy off           # Don't exit tmux when closing a session
set -g escape-time 0                   # Remove delay for ESC in Neovim
set -g history-limit 1000000           # Increase history size (from 2,000)
set -g mouse on                         # Enable mouse support
set -g allow-passthrough on            # Allow programs to bypass tmux (e.g., image preview)
set -g status-interval 1               # Update status bar every 3 seconds
set -g status-position top
set -g focus-events on
set -g base-index 1                     # Start windows at 1
set -g pane-base-index 1                # Start panes at 1
set -g renumber-windows on             # Automatically renumber windows when closed

# ─────────────────────────────────────────────────────────────
# 🗝 Prefix keys
# ─────────────────────────────────────────────────────────────
unbind C-b                              # Unbind default prefix
set -g prefix C-Space                   # New prefix: Ctrl+Space
set -g prefix2 C-f
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "✅ Reloaded!"

# ─────────────────────────────────────────────────────────────
# 🖥 Pane & window management
# ─────────────────────────────────────────────────────────────
# Kill current window/pane
unbind K
bind-key K kill-pane

# Split panes in current working directory
unbind %
bind v split-window -h -c "#{pane_current_path}"
unbind \"
bind h split-window -v -c "#{pane_current_path}"

# New window in same path
bind c new-window -c "#{pane_current_path}"

# Resize panes with vim arrow keys
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r H resize-pane -L 5

# Maximize pane
bind -r m resize-pane -Z

# Synchronize panes
bind-key y set-window-option synchronize-panes \; display-message "synchronize mode toggled."

# ─────────────────────────────────────────────────────────────
# 🔀 Window & pane navigation
# ─────────────────────────────────────────────────────────────
# Alt + arrow to switch panes
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Shift + arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Ctrl+Shift + arrow to reorder windows
bind-key -n C-S-Left  swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

# Change background color of a tab when activity occurs
setw -g monitor-activity on

# Do NOT reset the color of the tab after activity stops occuring
setw -g monitor-silence 0
# Lengthen the amount of time status messages are displayed
set-option -g display-time 400
set-option -g display-panes-time 400
# ─────────────────────────────────────────────────────────────
# 📋 Copy & paste (vi mode)
# ─────────────────────────────────────────────────────────────
set-window-option -g mode-keys vi
setw -g mode-keys vi

unbind p
bind p paste-buffer
bind P paste-buffer                       # Prefix + P to paste

# Copy mode vi keybindings
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Don't exit copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# ─────────────────────────────────────────────────────────────
# 🔌 TMUX Plugin Manager (TPM) & plugins

# tpm plugin manager
set -g @plugin 'tmux-plugins/tpm'

# List of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # Enable navigating between nvim and tmux
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum'    # Automatically saves sessions every 15 minutes
set -g @plugin 'tmux-plugins/tmux-battery'      #Battery
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor' # CPU and memory info
# My-theme.conf
# Set the TMUX_THEME variable
set-environment -g TMUX_THEME "my-theme"
source-file ~/.config/tmux/My-theme.conf
# set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# NOTE:
# - To apply theme changes: tmux kill-server && rm -rf /tmp/tmux-*
# - To avoid overlap, disable the Mac shortcut to switch input sources with Ctrl+Space in `System settings > Keyboard Shortcuts > Input Sources`# Status bar customization
# set -g status-left '#(cat #{socket_path}-\#{session_id}-vimbridge)'
# set -g status-left-length 99
# set -g status-right '#(cat #{socket_path}-\#{session_id}-vimbridge-R)'
# set -g status-right-length 99
# set -g status-justify absolute-centre
set -gq allow-passthrough on
set -g visual-activity off

# tell tmux to use 256-color as default
set -g default-terminal "tmux-256color"

# enable truecolor
set -ga terminal-overrides ",xterm-256color:Tc"

