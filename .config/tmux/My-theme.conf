##### ───────────────────────────────────────────────
#####  Status bar position + colors
##### ───────────────────────────────────────────────

# Place the status bar at the bottom
set -g status-position bottom

# Global status bar colors
set-option -g status-bg "#32344a"
set-option -g status-fg "#73daca"

# Center window list
set -g status-justify centre


##### ───────────────────────────────────────────────
#####  Left side: Session name + time + date
##### ───────────────────────────────────────────────

set-option -g status-left-length 50

#  separator | terminal icon | session name | clock | calendar
# set-option -g status-left "#[fg=#9ece6a]  #{session_name}  %H:%M  %Y-%m-%d"
set-option -g status-left "#[fg=#9ece6a]  #{session_name}  %H:%M  %m-%d"


##### ───────────────────────────────────────────────
#####  Right side: Hostname + CPU + Memory
##### ───────────────────────────────────────────────

set-option -g status-right-length 80

# 󰌢 = desktop icon | #H = hostname |  CPU usage |  memory |  separator
# set-option -g status-right "#[fg=color2]  󰌢 #H   #{cpu -i 3}   #{mem} 󰂎 #{battery_percentage} #{battery_status} #{battery_remain} "
set-option -g status-right "#[fg=#9ece6a]  󰌢 #H  #{cpu}  #{mem} 󰋊 #{disk}  #{battery_percentage} "

##### ───────────────────────────────────────────────
#####  Messages + notifications
##### ───────────────────────────────────────────────

# Popup/message styling
set-option -g message-style bg=#32344a,fg=#e0af68
##### ───────────────────────────────────────────────
#####  Window list styling
##### ───────────────────────────────────────────────

# Default window style
set-option -g window-status-style fg=#acb0d0
# Style for the active window
set-option -g window-status-current-style fg=#7aa2f7
# Active window format: terminal icon + index -> name
set -g window-status-current-format "#[fg=#7aa2f7,bg=default]  #I=>#W"
# Inactive window format: index:name
set -g window-status-format "#[fg=#acb0d0,bg=default]#I->#W"
